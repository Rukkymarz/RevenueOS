# Section 8 workflow as explicit connections. Each hop names the bus and the
# contract carried; CI proves the path is unbroken from ingress to insight.
flows:
  - {step: 1,  from: leads-agent,     to: mission-control, bus: task-api,    contract: task.command}
  - {step: 2,  from: mission-control, to: openbusiness,    bus: a2a-bus,     contract: a2a.message}
  - {step: 2,  from: openbusiness,    to: firecrawl,       bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 2,  from: openbusiness,    to: scraper,         bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 2,  from: openbusiness,    to: sec-edgar,       bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 3,  from: openbusiness,    to: crewai,          bus: a2a-bus,     contract: premise.bundle}
  - {step: 3,  from: crewai,          to: autogen-ag2,     bus: a2a-bus,     contract: a2a.message}
  - {step: 4,  from: autogen-ag2,     to: agentic-pm,      bus: a2a-bus,     contract: premise.bundle}
  - {step: 4,  from: agentic-pm,      to: mission-control, bus: task-api,    contract: task.command}
  - {step: 5,  from: mission-control, to: command-center,  bus: task-api,    contract: approval.request}
  - {step: 6,  from: command-center,  to: langgraph,       bus: task-api,    contract: task.command}
  - {step: 6,  from: langgraph,       to: nava,            bus: a2a-bus,     contract: a2a.message}
  - {step: 6,  from: nava,            to: omnipilot,       bus: a2a-bus,     contract: a2a.message}
  - {step: 6,  from: omnipilot,       to: photo-generator, bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 7,  from: langgraph,       to: open-pages,      bus: a2a-bus,     contract: a2a.message}
  - {step: 7,  from: open-pages,      to: ui-ux-pro-max,   bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 7,  from: open-pages,      to: tastemaker,      bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 7,  from: open-pages,      to: design-linter,   bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 7,  from: open-pages,      to: playwright-mcp,  bus: mcp-gateway, contract: mcp.tool_call}
  - {step: 8,  from: langgraph,       to: leads-agent,     bus: a2a-bus,     contract: a2a.message}
  - {step: 8,  from: leads-agent,     to: outreach,        bus: mcp-gateway, contract: mcp.tool_call}
