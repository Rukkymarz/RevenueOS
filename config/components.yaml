# RevenueOS component map: the single source of truth for how every component
# connects. Validated in CI by tests/connectivity/test_component_graph.py.
#
# Spec v3 R03/R04: every spec-named project is the primary implementation, pinned in
# config/sources.yaml. Tools added beyond the spec are extensions (>= 10k stars).
# Named projects that have no open-source license or no public repo are listed
# there as blocked; their extensions provide the capability until the owner
# resolves them. Hosted or closed services are `fallback` only.

buses:
  mcp-gateway:  {impl: forage+agent-discover, protocol: MCP,       contract: mcp.tool_call}
  a2a-bus:      {impl: aegis-ipc,             protocol: A2A,       contract: a2a.message}
  task-api:     {impl: apps/api (NestJS),     protocol: REST+WS,   contract: task.command}
  event-store:  {impl: postgres,              protocol: SQL,       contract: receipt}
  timeline:     {impl: tares timeline-writer, protocol: MCP,       contract: timeline.event}
  telemetry:    {impl: opentelemetry,         protocol: OTLP,      contract: otel.span}

