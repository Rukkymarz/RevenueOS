[project]
name = "revenueos-web"
version = "0.1.0"
description = "RevenueOS web service (C08)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-web = "revenueos_web.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_web"]
