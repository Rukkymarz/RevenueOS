[project]
name = "revenueos-marketing"
version = "0.1.0"
description = "RevenueOS marketing service (C10)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-marketing = "revenueos_marketing.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_marketing"]
