[project]
name = "revenueos-outreach"
version = "0.1.0"
description = "RevenueOS outreach service (C14)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-outreach = "revenueos_outreach.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_outreach"]
