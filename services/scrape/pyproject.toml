[project]
name = "revenueos-scrape"
version = "0.1.0"
description = "RevenueOS scrape service (C14)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-scrape = "revenueos_scrape.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_scrape"]
