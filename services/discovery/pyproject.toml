[project]
name = "revenueos-discovery"
version = "0.1.0"
description = "RevenueOS discovery service (C04)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-discovery = "revenueos_discovery.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_discovery"]
