[project]
name = "revenueos-learning"
version = "0.1.0"
description = "RevenueOS learning service (C13)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-learning = "revenueos_learning.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_learning"]
