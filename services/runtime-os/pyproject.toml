[project]
name = "revenueos-runtime-os"
version = "0.1.0"
description = "RevenueOS runtime-os service (C03)"
requires-python = ">=3.12"
dependencies = ["revenueos-common", "revenueos-risk", "revenueos-mcp-common", "revenueos-sandbox-supervisor"]

[project.scripts]
revenueos-runtime-os = "revenueos_runtime_os.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }
revenueos-risk = { workspace = true }
revenueos-mcp-common = { workspace = true }
revenueos-sandbox-supervisor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_runtime_os"]
