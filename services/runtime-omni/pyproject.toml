[project]
name = "revenueos-runtime-omni"
version = "0.1.0"
description = "RevenueOS runtime-omni service (C02)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-runtime-omni = "revenueos_runtime_omni.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_runtime_omni"]
