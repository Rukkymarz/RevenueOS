[project]
name = "revenueos-orchestrator"
version = "0.1.0"
description = "RevenueOS orchestrator service (C01)"
requires-python = ">=3.12"
dependencies = ["revenueos-common", "revenueos-mcp-common", "revenueos-contracts"]

[project.scripts]
revenueos-orchestrator = "revenueos_orchestrator.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }
revenueos-mcp-common = { workspace = true }
revenueos-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_orchestrator"]
