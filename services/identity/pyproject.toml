[project]
name = "revenueos-identity"
version = "0.1.0"
description = "RevenueOS identity service (C05)"
requires-python = ">=3.12"
dependencies = ["revenueos-common", "requests>=2.31"]

[project.scripts]
revenueos-identity = "revenueos_identity.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_identity"]
