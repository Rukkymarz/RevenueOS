[project]
name = "revenueos-media"
version = "0.1.0"
description = "RevenueOS media service (C14)"
requires-python = ">=3.12"
dependencies = ["revenueos-common"]

[project.scripts]
revenueos-media = "revenueos_media.__main__:main"

[tool.uv.sources]
revenueos-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_media"]
