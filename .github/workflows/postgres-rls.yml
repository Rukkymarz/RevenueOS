name: PostgreSQL tenant isolation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: revenueos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: revenueos-ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d revenueos"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      CI: "true"
      REVENUEOS_EPHEMERAL_DATABASE: "true"
      CI_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:revenueos-ci-admin-password@localhost:5432/revenueos
      CI_POSTGRES_APP_URL: postgresql+psycopg://revenueos_app:revenueos-ci-app-password@localhost:5432/revenueos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install API and tests
        run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
        working-directory: apps/api
      - name: Verify migrations and RLS using real PostgreSQL
        run: python scripts/test_postgres_rls.py
