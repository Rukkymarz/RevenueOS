name: Supabase migration isolation
on:
  push:
    branches: [main, codex/revenueos-cyber-executive-v6]
  pull_request:
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: revenueos_supabase_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d revenueos_supabase_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install psycopg[binary]==3.3.8
      - run: python scripts/test_supabase_rls.py
        env:
          REVENUEOS_TEST_DATABASE: 'true'
          SUPABASE_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@localhost:5432/revenueos_supabase_test
