# Standing security job (decision D10, Addendum H, Q7 extension).
# Findings at or above `high` block merge. A scan that did not run is DO_NOT_FILE, never PASS,
# and DO_NOT_FILE fails the check. Each scanner runs where Addendum H places it.
name: security
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pre_deploy:
        description: "Run the VulnHunter pre-deploy gate"
        type: boolean
        default: false

# Event context reaches scripts only through env vars, never `${{ }}` inside `run:` (injection).
env:
  EVENT_NAME: ${{ github.event_name }}
  REF_NAME: ${{ github.ref_name }}
  PRE_DEPLOY: ${{ inputs.pre_deploy }}

permissions:
  contents: read
  security-events: write

jobs:
  autosecscan:
    name: AutoSecScan (every commit; semgrep, trivy, gitleaks, osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built from the pinned source commit rather than the action's floating :latest image (R03).
      - name: build pinned image (outside the workspace so it is not scanned)
        run: |
          git clone -q https://github.com/jhammant/AutoSecScan "$RUNNER_TEMP/autosecscan"
          git -C "$RUNNER_TEMP/autosecscan" checkout -q 881d9602bfa1e45d8e0df021df4dd6b247df92f0
          docker build -q -t revenueos/autosecscan:881d960 "$RUNNER_TEMP/autosecscan"
      - name: scan
        continue-on-error: true
        run: |
          mkdir -p .security
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" -v "$GITHUB_WORKSPACE/.security:/reports" \
            --entrypoint sh revenueos/autosecscan:881d960 -c \
            'autosecscan authorize add-repo /work >/dev/null 2>&1 || true; autosecscan scan --repo /work --no-net --i-have-permission --format sarif,json --fail-on none --out /reports'
          sudo chown -R "$(id -u):$(id -g)" .security
      - name: verdict
        run: python3 scripts/autosecscan_verdict.py .security
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: autosecscan, path: .security, include-hidden-files: true }

  openhack:
    name: OpenHack (every PR; open models only)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Open-weight model on GitHub Models, authenticated by this workflow's own token (no user
    # secret). A self-hosted OpenAI-compatible endpoint can replace it via the
    # SECURITY_OPEN_MODEL_* secrets. A scan that does not complete is DO_NOT_FILE, never PASS.
    permissions: { contents: read, models: read }
    env:
      SELF_BASE_URL: ${{ secrets.SECURITY_OPEN_MODEL_BASE_URL }}
      SELF_API_KEY: ${{ secrets.SECURITY_OPEN_MODEL_API_KEY }}
      SELF_MODEL: ${{ secrets.SECURITY_OPEN_MODEL_NAME }}
      GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPEN_MODEL: ${{ vars.OPENHACK_OPEN_MODEL || 'meta/Llama-3.3-70B-Instruct' }}
    steps:
      - uses: actions/checkout@v4
      - name: applicability
        id: gate
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            python3 scripts/security_verdict.py openhack NOT_APPLICABLE "runs on pull requests"; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.run == 'true'
        name: scan
        run: |
          pip install -q "git+https://github.com/openhackai/OpenHack@6a0675ebd1287e8d7a651cccffae9b8f5d1e02a2"
          if [ -n "$SELF_BASE_URL" ] && [ -n "$SELF_API_KEY" ]; then
            export LLM_PROVIDER=openai OPENAI_BASE_URL="$SELF_BASE_URL" OPENAI_API_KEY="$SELF_API_KEY" OPENAI_MODEL="$SELF_MODEL"
            echo "model: self-hosted endpoint ($SELF_MODEL)"
          else
            export LLM_PROVIDER=github-models GITHUB_MODELS_MODEL="$OPEN_MODEL" GITHUB_TOKEN="$GH_MODELS_TOKEN"
            echo "model: GitHub Models $OPEN_MODEL"
            # Preflight: one tiny call, so a model the token cannot reach is reported, not silently skipped.
            code=$(curl -sS -o /tmp/preflight.json -w '%{http_code}' https://models.github.ai/inference/chat/completions \
              -H "authorization: Bearer $GH_MODELS_TOKEN" -H 'content-type: application/json' \
              -d "{\"model\":\"$OPEN_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"reply ok\"}],\"max_tokens\":5}")
            echo "preflight HTTP $code: $(head -c 300 /tmp/preflight.json)"
          fi
          export PROMPT_CACHING=false
          # The `openhack` CLI insists on an OpenHack account key even when another provider is
          # selected; its headless scanner (same pipeline) only needs the provider above.
          timeout 60m python -c 'import asyncio, sys; from openhack.headless_scan import run_headless_scan; asyncio.run(run_headless_scan(sys.argv[1]))' "$GITHUB_WORKSPACE" || echo "openhack exited $?"
          mkdir -p .security
          report=$(ls -t ~/.openhack/scans/*.json 2>/dev/null | head -1)
          [ -n "$report" ] && cp "$report" .security/openhack.json
          python3 scripts/openhack_verdict.py .security/openhack.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: openhack, path: .security, include-hidden-files: true }

  open-kritt:
    name: open-kritt (release branches)
    runs-on: ubuntu-latest
    env:
      KRITT_HOST_REPORT_URL: ${{ secrets.KRITT_HOST_REPORT_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          case "$REF_NAME" in
            release/*)
              # open-kritt's `scan create` is an interactive guided flow on an operator-provisioned host
              # (its threat model requires a dedicated VM); CI cannot start it unattended.
              if [ -z "$KRITT_HOST_REPORT_URL" ]; then
                python3 scripts/security_verdict.py open-kritt DO_NOT_FILE "no operator open-kritt host report for this release"
              else
                curl -fsSL "$KRITT_HOST_REPORT_URL/$GITHUB_SHA.json" -o kritt.json \
                  || python3 scripts/security_verdict.py open-kritt DO_NOT_FILE "no export for $GITHUB_SHA"
                python3 -c "import json,sys; f=json.load(open('kritt.json')).get('findings',[]); h=[x for x in f if str(x.get('severity','')).lower() in ('high','critical')]; sys.exit(1 if h else 0)" \
                  && python3 scripts/security_verdict.py open-kritt PASS "export has no high/critical finding" \
                  || python3 scripts/security_verdict.py open-kritt FAIL "high/critical findings in export"
              fi ;;
            *) python3 scripts/security_verdict.py open-kritt NOT_APPLICABLE "runs on release branches" ;;
          esac

  vulnhunter:
    name: VulnHunter (pre-deploy gate)
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.VULNHUNTER_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: applicability and credentials
        id: gate
        run: |
          if [ "$PRE_DEPLOY" != "true" ] && [[ "$REF_NAME" != release/* ]]; then
            python3 scripts/security_verdict.py vulnhunter NOT_APPLICABLE "runs before a deploy (release branch or pre_deploy dispatch)"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            python3 scripts/security_verdict.py vulnhunter DO_NOT_FILE "VULNHUNTER_ANTHROPIC_API_KEY secret not set"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.run == 'true'
        name: scan every service
        run: |
          git clone https://github.com/capitalone/VulnHunter /tmp/vulnhunter && git -C /tmp/vulnhunter checkout 6d25b5c58b7820809b391ecda6a102537effe3ba
          cd /tmp/vulnhunter/vulnhunter-agent && python -m pip install -e . && cd -
          python -m agent "https://github.com/$GITHUB_REPOSITORY" --no-publish --no-issues \
            && python3 scripts/security_verdict.py vulnhunter PASS "no verified exploitable finding" \
            || python3 scripts/security_verdict.py vulnhunter FAIL "verified exploitable finding or scanner error"

  strix:
    name: Strix (generated websites, before the Phase 9 design gate)
    runs-on: ubuntu-latest
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.STRIX_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: applicability and credentials
        id: gate
        run: |
          if [ ! -d apps/sites ]; then
            python3 scripts/security_verdict.py strix NOT_APPLICABLE "no generated websites yet (apps/sites lands in Phase 9)"; echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LLM_API_KEY" ] || [ -z "$STRIX_LLM" ]; then
            python3 scripts/security_verdict.py strix DO_NOT_FILE "STRIX_LLM / STRIX_LLM_API_KEY secrets not set"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - if: steps.gate.outputs.run == 'true'
        run: |
          pip install "git+https://github.com/usestrix/strix@4719329d1c3eb0db796714397551945c514a2301"
          strix -n -t ./apps/sites --scan-mode quick \
            && python3 scripts/security_verdict.py strix PASS "no vulnerability found" \
            || python3 scripts/security_verdict.py strix FAIL "vulnerabilities found (strix exits non-zero)"
