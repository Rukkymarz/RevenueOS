name: Validate RevenueOS
on:
  push:
    branches: [main, codex/revenueos-cyber-executive-v6]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
      - run: python -m compileall -q revenueos
        working-directory: apps/api
      - run: python scripts/check_release.py
      - run: pytest -q scripts/test_backup_production.py
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r apps/api/requirements.lock --no-deps --disable-pip
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: node --import tsx --test tests/serverless.test.ts
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm audit --audit-level=high
        working-directory: apps/web
