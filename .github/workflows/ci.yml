name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node build, lint, test (contracts ts1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm turbo run lint
      - run: pnpm turbo run test
      - name: keep contract artifacts for the Python side
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: |
            packages/contracts/generated
            packages/contracts/out/ts
            packages/contracts/dist
            pnpm-lock.yaml

  python:
    name: python tests, coverage, invariants, Q-gates (contracts py)
    needs: node
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      REVENUEOS_PG_HOST: localhost
      REVENUEOS_PG_PORT: "5432"
      REVENUEOS_PG_USER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: contracts, path: packages/contracts-artifacts }
      - run: cp -r packages/contracts-artifacts/packages/contracts/* packages/contracts/ && rm -rf packages/contracts-artifacts
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: >-
          pip install pytest pytest-cov pyyaml jsonschema requests starlette uvicorn httpx "pydantic>=2.8"
          "datamodel-code-generator>=0.26" "fastmcp>=2.12,<3" opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      - run: sh scripts/gen-python-contracts.sh
      - name: Q-gates (Q1 contracts + connectivity, Q2 tests + coverage, Q6 invariants, Q7 secret hygiene)
        run: python scripts/qgate.py 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-results
          path: |
            packages/contracts/out/py
            docs/reviews/phase-1-qgates.json
            coverage.json

  contracts-ts2:
    name: contracts round trip ts2 (Python -> TypeScript)
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile --filter @revenueos/contracts...
      - run: pnpm --filter @revenueos/contracts build
      - uses: actions/download-artifact@v4
        with: { name: python-results, path: results }
      - run: mkdir -p packages/contracts/out && cp -r results/packages/contracts/out/py packages/contracts/out/py
      - run: pnpm --filter @revenueos/contracts test:ts2

  compose:
    name: docker compose up + Phase 1 acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: sh infra/bootstrap.sh
      - run: docker compose -f infra/compose.yaml --profile test build
      - run: docker compose -f infra/compose.yaml --profile test up -d --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest requests pyyaml
      - name: acceptance
        run: REVENUEOS_E2E=1 pytest -q tests/e2e -p no:cacheprovider 2>&1 | tee phase-1-acceptance.log
      - if: always()
        run: docker compose -f infra/compose.yaml --profile test logs --no-color 2>&1 | tee compose.log | tail -300 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: |
            phase-1-acceptance.log
            compose.log
            infra/otel/out/traces.jsonl

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
