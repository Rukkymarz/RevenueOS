[project]
name = "revenueos-contracts"
version = "0.1.0"
description = "Pydantic models generated from packages/contracts zod schemas (do not edit models.py by hand)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_contracts"]
