[project]
name = "revenueos-mcp-common"
version = "0.1.0"
description = "MCP scaffolding for RevenueOS: auth, OpenTelemetry, receipts, approvals, secret-by-ref, rate limiting, health, contract validation"
requires-python = ">=3.12"
dependencies = [
  "revenueos-common",
  "revenueos-contracts",
  "fastmcp>=2.12,<3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "pydantic>=2.8",
]

[tool.uv.sources]
revenueos-common = { workspace = true }
revenueos-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_mcp_common"]
