[project]
name = "revenueos-common"
version = "0.1.0"
description = "Shared core for RevenueOS Python services: canonical hashing, database, secrets, service skeleton, CLI"
requires-python = ">=3.12"
dependencies = ["starlette>=0.40", "uvicorn>=0.30", "requests>=2.32", "pyyaml>=6"]

[project.scripts]
revenueos = "revenueos_common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_common"]
