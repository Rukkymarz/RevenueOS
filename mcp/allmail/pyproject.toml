[project]
name = "revenueos-mcp-allmail"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["revenueos-mcp-common", "pyyaml>=6"]

[project.scripts]
revenueos-mcp-allmail = "revenueos_mcp_allmail.server:main"

[tool.uv.sources]
revenueos-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_mcp_allmail"]
