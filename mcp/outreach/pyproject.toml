[project]
name = "revenueos-mcp-outreach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["revenueos-mcp-common"]

[project.scripts]
revenueos-mcp-outreach = "revenueos_mcp_outreach.server:main"

[tool.uv.sources]
revenueos-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_mcp_outreach"]
