[project]
name = "revenueos-mcp-echo-probe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["revenueos-mcp-common"]

[project.scripts]
revenueos-mcp-echo-probe = "revenueos_mcp_echo_probe.server:main"

[tool.uv.sources]
revenueos-mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revenueos_mcp_echo_probe"]
