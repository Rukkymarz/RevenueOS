name: revenueos
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: revenueos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revenueos"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [internal]

  migrate:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${DB_ROOT_PASSWORD}@db:5432/revenueos
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/keycloak/revenueos-realm.json:/opt/keycloak/data/import/revenueos-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal]
    restart: unless-stopped
    # Local-only development mode; replace with persistent Keycloak DB + HTTPS in production.

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://revenueos_app:${APP_DB_PASSWORD}@db:5432/revenueos
      OIDC_ISSUER: http://localhost:8080/realms/revenueos
      OIDC_JWKS_URL: http://keycloak:8080/realms/revenueos/protocol/openid-connect/certs
      OIDC_AUDIENCE: revenueos-api
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MEDIA_DIR: /data/media
    volumes:
      - media_data:/data/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8080/realms/revenueos
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    profiles: [cache]
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  media_data:
networks:
  internal:
    driver: bridge
