# Egress policy (Phase 1). Per-agent host allowlist and secret bindings by reference.
# Phase 2 moves this into Postgres (egress_rules / secret_bindings) with per-task rules.
agents:
  "7a1c2e30-0001-4000-8000-000000000001":   # probe agent (seeded by db/seed/0001_probe.sql)
    allow: ["upstream-echo:8080"]
secret_bindings:
  - host: "upstream-echo:8080"
    header: authorization
    format: "Bearer {}"
    secret_ref: "keychain://upstream-echo-token"
    agents: ["7a1c2e30-0001-4000-8000-000000000001"]
